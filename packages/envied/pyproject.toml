[build-system]
requires = ["uv_build>=0.8.12,<0.9.21"]
build-backend = "uv_build"

[project]
name = "envied"
version = "5.3.0"
description = "Modular Movie, TV, and Music Archival Software."
authors = [{ name = "rlaphoenix and others" }]
requires-python = ">=3.10,<=3.15"
readme = "README.md"
license = "GPL-3.0-only"
keywords = [
    "python",
    "downloader",
    "drm",
    "widevine",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "appdirs>=1.4.4,<2",
    "Brotli>=1.2.0,<2",
    "click>=8.1.8,<9",
    "construct>=2.8.8,<3",
    "crccheck>=1.3.0,<2",
    "filelock>=3.20.3,<4",
    "fonttools>=4.60.2,<5",
    "jsonpickle>=3.0.4,<5",
    "langcodes>=3.4.0,<4",
    "lxml>=5.2.1,<7",
    "protobuf>=4.25.3,<7",
    "pycaption>=2.2.6,<3",
    "pycryptodomex>=3.20.0,<4",
    "pyjwt>=2.12.0,<3",
    "pymediainfo>=6.1.0,<8",
    "pymp4>=1.4.0,<2",
    "pymysql>=1.1.0,<2",
    "pywidevine[serve]>=1.8.0,<2",
    "PyYAML>=6.0.1,<7",
    "requests[socks]>=2.32.5,<3",
    "rich>=13.7.1,<15.1",
    "rlaphoenix.m3u8>=3.4.0,<4",
    "ruamel.yaml>=0.18.6,<0.19",
    "sortedcontainers>=2.4.0,<3",
    "subtitle-filter>=1.4.9,<2",
    "Unidecode>=1.3.8,<2",
    "urllib3>=2.6.3,<3",
    "chardet>=5.2.0,<6",
    "pyplayready>=0.8.3,<0.9",
    "cryptography>=45.0.0,<47",
    "subby",
    "aiohttp>=3.13.4,<4",
    "aiohttp-swagger3>=0.9.0,<1",
    "pysubs2>=1.7.0,<2",
    "PyExecJS>=1.5.1,<2",
    "pycountry>=24.6.1",
    "language-data>=1.4.0",
    "wasmtime>=41.0.0",
    "animeapi-py>=0.6.0",
    "rnet>=2.4.2",
    "bandit>=1.9.4",
    "defusedxml>=0.7.1",
    "jsonpath-ng>=1.8.0",
    "mutagen>=1.47.0",
    # envied specific dependencies
    "webvtt-py>=0.5.1,<0.6",
    "isodate>=0.7.2,<0.8",
    "scrapy>=2.14.0,<3",
    "mypy>=1.19.1,<=2.1.0",
    "httpx>=0.28.0,<0.35",


  # Keeping your existing cap style here; latest visible is 0.10.0.
  #"aiohttp-swagger3>=0.10.0,<1",
]


[project.urls]
Homepage = "https://github.com/envied-dl/envied"
Repository = "https://github.com/envied-dl/envied"
Issues = "https://github.com/envied-dl/envied/issues"
Discussions = "https://github.com/envied-dl/envied/discussions"
Changelog = "https://github.com/envied-dl/envied/blob/master/CHANGELOG.md"

[project.scripts]
envied = "envied.core.__main__:main"

[dependency-groups]
dev = [
    "pre-commit>=3.7.0,<4",
    "mypy>=1.18.2,<2",
    "mypy-protobuf>=3.6.0,<4",
    "types-protobuf>=4.24.0.20240408,<5",
    "types-PyMySQL>=1.1.0.1,<2",
    "types-requests>=2.31.0.20240406,<3",
    "isort>=5.13.2,<6",
    "ruff~=0.3.7"
]

#[tool.hatch.build.targets.wheel]
#packages = ["envied"]


[tool.ruff]
force-exclude = true
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]

[tool.isort]
line_length = 118

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
no_implicit_optional = true

[tool.uv.sources]
#subby = { git = "https://github.com/vevv/subby.git" }
subby = { git = "https://github.com/vevv/subby.git", rev = "a057280f31acd3a0ba5c6dc69eaefbb88aea974e" }

